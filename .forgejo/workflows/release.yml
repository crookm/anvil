name: release

on:
  push:
    tags: [ "v*" ]

jobs:
  publish-binary:
    runs-on: docker
    env:
      DOTNET_INSTALL_DIR: ~/.local/bin/dotnet
    strategy:
      fail-fast: true
      matrix:
        runtime:
          - linux-x64

    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v4
      - name: Setup .NET
        uses: https://github.com/actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build -c Release --no-restore
      - name: Publish
        run: |
          VERSION=${{ github.ref_name }}
          dotnet publish src/Anvil.Server -c Release -r ${{ matrix.runtime }} -o publish /p Version=${VERSION#v}

      - name: Upload artifacts
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: ${{ matrix.runtime }}
          path: publish/anvil-server_${{ matrix.runtime }}

  publish-container:
    runs-on: docker
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      DOCKER_BUILD_RECORD_UPLOAD: false
    
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v4
      - name: Login to registry
        uses: https://data.forgejo.org/docker/login-action@v3.4.0
        with:
          registry: enduringtech.dev
          username: matt
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Extract metadata
        id: metadata
        uses: https://data.forgejo.org/docker/metadata-action@v5.7.0
        with:
          images: enduringtech.dev/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: push
        uses: https://data.forgejo.org/docker/build-push-action@v6.15.0
        with:
          push: true
          file: Dockerfile
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

  release:
    runs-on: docker
    permissions:
      contents: write
    needs:
      - publish-binary
      - publish-container

    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v4
      - name: Download artifacts
        uses: https://data.forgejo.org/forgejo/download-artifact@v4
        with:
          path: bin
          merge-multiple: true

      - name: Generate changelog
        id: changelog
        uses: https://enduringtech.dev/actions/changelog-action@v0.1.0
        with:
          tag: ${{ github.ref_name }}

      - name: Create release
        uses: https://enduringtech.dev/actions/release-action@1.3.2
        with:
          draft: true
          files: bin/*
          sha256sum: true
          body: ${{ steps.changelog.outputs.changes }}

      - name: Commit changelog
        uses: https://github.com/stefanzweifel/git-auto-commit-action@e348103e9026cc0eee72ae06630dbe30c8bf7a79 # v5.1.0
        with:
          branch: main
          commit_message: 'docs: update changelog for ${{ github.ref_name }} [skip ci]'
          file_pattern: CHANGELOG.md
          commit_user_name: forge[bot]
          commit_user_email: forge.svc@enduringtech.dev
          commit_author: ${{ github.actor }} <${{ github.actor }}@noreply.enduringtech.dev>
