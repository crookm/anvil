name: release

on:
  push:
    tags: [ "v*" ]

jobs:
  publish-binary:
    runs-on: docker
    env:
      DOTNET_INSTALL_DIR: ~/.local/bin/dotnet
    strategy:
      fail-fast: true
      matrix:
        runtime:
          - linux-x64

    steps:
      - name: Checkout
        uses: https://enduringtech.dev/actions/checkout-action@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Setup .NET
        uses: https://enduringtech.dev/actions/setup-dotnet-action@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build -c Release --no-restore
      - name: Publish
        run: |
          VERSION=${{ github.ref_name }}
          dotnet publish src/Anvil.Server -c Release -r ${{ matrix.runtime }} -o publish /p Version=${VERSION#v}

      - name: Upload artifacts
        uses: https://enduringtech.dev/actions/upload-artifact-action@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: ${{ matrix.runtime }}
          path: publish/anvil-server_${{ matrix.runtime }}

  publish-container:
    runs-on: docker
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      DOCKER_BUILD_RECORD_UPLOAD: false
    
    steps:
      - name: Checkout
        uses: https://enduringtech.dev/actions/checkout-action@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Login to registry
        uses: https://enduringtech.dev/actions/docker-login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: enduringtech.dev
          username: matt
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Extract metadata
        id: metadata
        uses: https://enduringtech.dev/actions/docker-metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: enduringtech.dev/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: push
        uses: https://enduringtech.dev/actions/docker-build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          push: true
          file: Dockerfile
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

  release:
    runs-on: docker
    permissions:
      contents: write
    needs:
      - publish-binary
      - publish-container

    steps:
      - name: Checkout
        uses: https://enduringtech.dev/actions/checkout-action@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Download artifacts
        uses: https://enduringtech.dev/actions/download-artifact-action@d8d0a99033603453ad2255e58720b460a0555e1e # v4
        with:
          path: bin
          merge-multiple: true

      - name: Generate changelog
        id: changelog
        uses: https://enduringtech.dev/actions/changelog-action@3a3d44d35ba5e531a65472b3bfd89f998225044a # v0.1.0
        with:
          tag: ${{ github.ref_name }}

      - name: Create release
        uses: https://enduringtech.dev/actions/release-action@f119011bd6c95ab53d2084ace7b539694ce9b252 # v1.3.2
        with:
          draft: true
          files: bin/*
          sha256sum: true
          body: ${{ steps.changelog.outputs.changes }}

      - name: Commit changelog
        uses: https://enduringtech.dev/actions/commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5.2.0
        with:
          branch: main
          commit_message: 'docs: update changelog for ${{ github.ref_name }} [skip ci]'
          file_pattern: CHANGELOG.md
          commit_user_name: forge[bot]
          commit_user_email: forge.svc@enduringtech.dev
          commit_author: ${{ github.actor }} <${{ github.actor }}@noreply.enduringtech.dev>
