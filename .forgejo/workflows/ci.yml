name: ci

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: docker
    env:
      DOTNET_INSTALL_DIR: ~/.local/bin/dotnet

    steps:
      - name: Checkout
        uses: https://enduringtech.dev/actions/checkout-action@v4
      - name: Setup .NET
        uses: https://enduringtech.dev/actions/setup-dotnet-action@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build -c Release --no-restore
      - name: Test
        run: dotnet test
      - name: Publish
        run: dotnet publish src/Anvil.Server -c Release -o publish /p AssemblyName=anvil-server

      - name: Upload artifacts
        uses: https://enduringtech.dev/actions/upload-artifact-action@v4
        with:
          name: application
          path: publish/anvil-server
