name: ci

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: docker
    env:
      DOTNET_INSTALL_DIR: ~/.local/bin/dotnet

    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v4
      - name: Setup .NET
        uses: https://github.com/actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build -c Release --no-restore
      - name: Test
        run: dotnet test
      - name: Publish
        run: dotnet publish src/Anvil.Server -c Release -o publish /p AssemblyName=anvil-server

      - name: Upload artifacts
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: application
          path: publish/anvil-server
